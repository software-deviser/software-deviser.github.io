<style>
@import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap");

:root {
  --bg: #0f1115;
  --surface: #171a21;
  --surface-alt: #1f2330;
  --border: #2a2e3a;
  --accent-purple: #7f52ff;
  --accent-purple-dim: #7f52ff33;
  --accent-green: #3ddc84;
  --text: #e8e6f0;
  --text-muted: #8b8d98;
  --radius: 10px;
  --display: "Space Grotesk", sans-serif;
  --body: "Inter", sans-serif;
  --mono: "JetBrains Mono", monospace;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  line-height: 1.6;
}

@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  * {
    animation: none !important;
    transition: none !important;
  }
}

a {
  color: inherit;
}

::selection {
  background: var(--accent-purple-dim);
  color: var(--text);
}

.app {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

/* ---------- Tab bar nav ---------- */
.tabbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  gap: 2px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  padding-top: 12px;
  scrollbar-width: none;
}
.tabbar::-webkit-scrollbar {
  display: none;
}
.tab {
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--text-muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-bottom: none;
  padding: 9px 16px;
  border-radius: 8px 8px 0 0;
  white-space: nowrap;
  cursor: pointer;
  transition: color 0.15s ease, background 0.15s ease;
}
.tab:hover {
  color: var(--text);
}
.tab.active {
  color: var(--accent-green);
  background: var(--surface-alt);
}
.tab .dot {
  color: var(--accent-purple);
  margin-right: 6px;
}

/* ---------- Hero ---------- */
.hero {
  padding: 56px 0 40px;
  border-bottom: 1px solid var(--border);
}
.status-line {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 28px;
}
.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent-green);
  box-shadow: 0 0 0 3px var(--accent-purple-dim);
}
.hero-name {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(34px, 6vw, 52px);
  letter-spacing: -0.5px;
  line-height: 1.05;
}
.hero-title {
  margin-top: 10px;
  font-family: var(--mono);
  font-size: clamp(13px, 2vw, 15px);
  color: var(--accent-green);
}
.hero-title .sep {
  color: var(--text-muted);
  margin: 0 8px;
}
.hero-contact {
  margin-top: 22px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px 18px;
  font-size: 13px;
  color: var(--text-muted);
}
.hero-contact a {
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color 0.15s ease, color 0.15s ease;
}
.hero-contact a:hover,
.hero-contact a:focus-visible {
  color: var(--accent-purple);
  border-color: var(--accent-purple);
}

/* dock of "installed apps" = project chips */
.dock {
  margin-top: 32px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.dock-icon {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--display);
  font-weight: 700;
  font-size: 15px;
  color: var(--accent-purple);
  transition: transform 0.15s ease, border-color 0.15s ease;
}
.dock-icon:hover {
  transform: translateY(-3px);
  border-color: var(--accent-purple);
}

/* ---------- Section shell ---------- */
section {
  padding: 44px 0;
  border-bottom: 1px solid var(--border);
  scroll-margin-top: 56px;
}
section:last-of-type {
  border-bottom: none;
}
.section-label {
  font-family: var(--mono);
  font-size: 12.5px;
  color: var(--accent-purple);
  margin-bottom: 22px;
}
.section-label::before {
  content: "// ";
  color: var(--text-muted);
}

/* ---------- Summary ---------- */
.summary-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.summary-list li {
  position: relative;
  padding-left: 22px;
  color: var(--text);
  font-size: 15px;
}
.summary-list li::before {
  content: "▸";
  position: absolute;
  left: 0;
  color: var(--accent-green);
}

/* ---------- Experience / Education entries ---------- */
.entry {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 20px;
  margin-bottom: 30px;
}
.entry:last-child {
  margin-bottom: 0;
}
.entry-meta .company {
  font-weight: 600;
  font-size: 14.5px;
  color: var(--text);
}
.entry-meta .date-loc {
  margin-top: 4px;
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--text-muted);
  line-height: 1.5;
}
.entry-body .job-title {
  font-family: var(--display);
  font-weight: 600;
  font-size: 17px;
  margin-bottom: 10px;
  color: var(--text);
}
.entry-body ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.entry-body li {
  position: relative;
  padding-left: 18px;
  font-size: 14.5px;
  color: var(--text-muted);
}
.entry-body li::before {
  content: "–";
  position: absolute;
  left: 0;
  color: var(--accent-purple);
}

/* ---------- Skills ---------- */
.skill-group {
  margin-bottom: 20px;
}
.skill-group:last-child {
  margin-bottom: 0;
}
.skill-group-label {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--text-muted);
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.skills-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.skill-tag {
  font-family: var(--mono);
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  transition: border-color 0.15s ease, color 0.15s ease;
}
.skill-tag:hover {
  border-color: var(--accent-green);
  color: var(--accent-green);
}

/* ---------- Projects ---------- */
.projects-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.project-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  flex-direction: column;
  transition: border-color 0.15s ease, transform 0.15s ease;
}
.project-card:hover {
  border-color: var(--accent-purple);
  transform: translateY(-2px);
}
.project-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 12px;
}
.project-name {
  font-family: var(--display);
  font-weight: 600;
  font-size: 16px;
}
.project-name a {
  text-decoration: none;
  color: var(--accent-green);
  border-bottom: 1px dashed var(--accent-green);
}
.project-date {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--text-muted);
  white-space: nowrap;
}
.project-card ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.project-card li {
  position: relative;
  padding-left: 16px;
  font-size: 13.5px;
  color: var(--text-muted);
}
.project-card li::before {
  content: "·";
  position: absolute;
  left: 2px;
  color: var(--accent-purple);
  font-weight: 700;
}

/* ---------- Education / Languages ---------- */
.languages-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

/* ---------- Footer ---------- */
.footer {
  padding: 32px 0 12px;
  text-align: center;
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--text-muted);

/* ---------- Responsive ---------- */
@media (max-width: 640px) {
  .entry {
    grid-template-columns: 1fr;
    gap: 6px;
  }
  .app {
    padding: 0 16px 60px;
  }
}

/* ---------- Focus states ---------- */
a:focus-visible,
.tab:focus-visible {
  outline: 2px solid var(--accent-purple);
  outline-offset: 2px;
}

</style>
</head>

const TABS = [

];

function TabBar() {
  const [active, setActive] = useState("summary");
  useEffect(() => {
    const sections = TABS.map((t) => document.getElementById(t.id)).filter(Boolean);
    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) setActive(entry.target.id);
        });
      },
      { rootMargin: "-30% 0px -60% 0px" }
    );
    sections.forEach((s) => observer.observe(s));
    return () => observer.disconnect();
  }, []);
  return (
    <nav className="tabbar" aria-label="Section navigation">
      {TABS.map((t) => (
        <a key={t.id} href={"#" + t.id} className={"tab" + (active === t.id ? " active" : "")}>
          <span className="dot">●</span>
          {t.label}
        </a>
      ))}
    </nav>
  );
}
